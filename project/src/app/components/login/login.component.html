<p-dialog [(visible)]="visible" [style]="{ width: '450px' }" header="Login" [modal]="true"
    styleClass="p-fluid" (onHide)="hideDialog()">
    <ng-template pTemplate="content">
        <div class="field">
            <label for="name">Name</label>
            <input type="name" pInputText id="name" [(ngModel)]="name" required autofocus />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" pInputText id="password" [(ngModel)]="password" required />
        </div>
        <div *ngIf="isLoginError" class="error-message">
            <i class="pi pi-exclamation-circle"></i> wrong name or password
        </div>
        
    </ng-template>

    <ng-template pTemplate="footer">
        <p-button label="Cancel" icon="pi pi-times" [text]="true" (onClick)="hideDialog()" />
        <p-button label="Login" icon="pi pi-check" [text]="true" (onClick)="checkAdmin()"
            [disabled]="!name.trim() || !password" />
    </ng-template>
</p-dialog>
